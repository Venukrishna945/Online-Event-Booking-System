<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizer Dashboard - Event Booking Hub</title>
  <link rel="stylesheet" href="css1/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
    }

    header {
      background-color: #004aad;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    header h1 { 
      margin: 0; 
      font-size: 1.8rem;
    }


    .dashboard-container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .dashboard-container h2 {
      color: #333;
      margin-bottom: 1rem;
    }

    .cards {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .card {
      flex: 1;
      min-width: 200px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 1.5rem;
      text-align: center;
    }

    .card h2 {
      margin: 0;
      font-size: 2rem;
      color: #333;
    }

    .card p {
      margin: 0.5rem 0 0;
      font-weight: bold;
      color: #666;
    }

    #createEventBtn {
      background: #004aad;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 1.5rem;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    
    #createEventBtn:hover {
      background: #003582;
    }

    .event-card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 4px solid #004aad;
    }
    
    .event-card h3 {
      margin: 0 0 10px;
      color: #333;
    }
    
    .event-card p {
      margin: 5px 0;
      color: #666;
    }

    .event-card button {
      margin-right: 10px;
      background: #004aad;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .event-card button:hover {
      background: #003582;
    }

    .event-card button.delete {
      background: #e74c3c;
    }
    
    .event-card button.delete:hover {
      background: #c0392b;
    }

    /* Popup Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      width: 400px;
      max-width: 90%;
    }
    
    .modal-content h3 {
      margin-top: 0;
      color: #333;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 10px;
      border-radius: 5px;
      border: 2px solid #ddd;
      box-sizing: border-box;
      font-size: 14px;
    }
    
    .modal-content input:focus, .modal-content textarea:focus {
      border-color: #004aad;
      outline: none;
    }

    .modal-content button {
      background: #004aad;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }
    
    .modal-content button:hover {
      background: #003582;
    }
    
    #create-event-form {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    
    #create-event-form input, #create-event-form textarea {
      width: 100%;
      margin-bottom: 1rem;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }
    
    #create-msg {
      margin-top: 1rem;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }
    
    .status-pending {
      color: #f39c12;
      font-weight: bold;
    }
    
    .status-approved {
      color: #27ae60;
      font-weight: bold;
    }
    
    .status-rejected {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>EventHub - Organizer Dashboard</h1>
    <nav class="navbar" id="navbar">
      <!-- Dynamic navbar will be injected here -->
    </nav>
  </header>

  <main class="dashboard-container" id="organizer-dashboard">
    <h2>Organizer Dashboard</h2>

    <!-- Analytics Cards -->
    <div class="cards">
      <div style="background: linear-gradient(135deg, #a8edea, #fed6e3);" class="card" id="totalEventsCard">
        <h2>0</h2>
        <p>Total Events</p>
      </div>
      <div style="background: linear-gradient(135deg, #a8edea, #fed6e3);" class="card" id="ticketsSoldCard">
        <h2>0</h2>
        <p>Tickets Sold</p>
      </div>
      <div style="background: linear-gradient(135deg, #a8edea, #fed6e3);" class="card" id="revenueCard">
        <h2>₹0</h2>
        <p>Total Revenue</p>
      </div>
      <div style="background: linear-gradient(135deg, #a8edea, #fed6e3);" class="card" id="avgBookingCard">
        <h2>0%</h2>
        <p>Booking %</p>
      </div>
    </div>

    <br>
    <button id="createEventBtn">Create New Event</button>

    <!-- Create Event Form -->
    <form id="create-event-form" style="display:none;">
      <h3>Create New Event</h3>
      <input type="text" id="title" placeholder="Event Title" required>
      <textarea id="description" placeholder="Description" rows="4"></textarea>
      <input type="datetime-local" id="date" required>
      <input type="text" id="location" placeholder="Location" required>
      <input type="number" id="seats" placeholder="Total Seats" required min="1">
      <input type="number" id="price" placeholder="Price (₹)" step="0.01" min="0">
      <input type="text" id="image" placeholder="Image URL (optional)">
      <button type="submit">Create Event</button>
      <p id="create-msg"></p>
    </form>

    <h3>Your Events</h3>
    <div id="my-events">
      <!-- Events will be loaded here -->
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Edit Event</h3>
      <input type="hidden" id="editId">
      <input type="text" id="editTitle" placeholder="Event Title">
      <textarea id="editDescription" placeholder="Description" rows="4"></textarea>
      <input type="datetime-local" id="editDate">
      <input type="text" id="editLocation" placeholder="Location">
      <input type="number" id="editSeats" placeholder="Seats" min="1">
      <input type="number" id="editPrice" placeholder="Price (₹)" step="0.01" min="0">
      <input type="text" id="editImage" placeholder="Image URL">
      <button id="updateEventBtn">Update</button>
      <button id="closeModalBtn" style="background: #6c757d;">Cancel</button>
    </div>
  </div>
  <script>
  console.log("Organizer page loaded successfully");
</script>


  <script src="Js1/organizer.js"></script>
</body>
</html>
