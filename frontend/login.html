<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Event Booking Hub</title>
  <link rel="stylesheet" href="css1/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #004aad, #007bff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .auth-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    
    #login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    #login-form input {
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    #login-form input:focus {
      border-color: #004aad;
      outline: none;
    }
    
    #login-form button {
      background: #004aad;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    #login-form button:hover {
      background: #003582;
    }
    
    .auth-container p {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    
    .auth-container a {
      color: #004aad;
      text-decoration: none;
      font-weight: bold;
    }
    
    .auth-container a:hover {
      text-decoration: underline;
    }
    
    #login-msg {
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register</a></p>
    <p id="login-msg"></p>
  </div>
  <script src="Js1/auth.js"></script>
</body>
</html>
