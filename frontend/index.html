<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Booking Hub</title>
  <link rel="stylesheet" href="css1/style.css" />
  <style>
    /* Navbar and search styling */
    /* .navbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: 210px;
    }

    .navbar a {
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #ffd700;
    } */

    .search-bar {
      margin-left: 90px;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 25px;
      padding: 5px 10px;
    }

    .search-bar input {
      border: none;
      outline: none;
      padding: 6px 10px;
      font-size: 14px;
      width: 250px;
      border-radius: 20px;
    }

    /* Event cards */
    .event-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .event-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: left;
      transition: transform 0.2s ease-in-out;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
      height: 180px;
      object-fit: cover;
    }

    .event-card h3 {
      margin: 10px 0 5px;
      color: #333;
    }

    .event-card p {
      color: #555;
      font-size: 14px;
      margin: 4px 0;
    }

    .btn-book {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
    }

    .btn-book:hover {
      background: #0056b3;
    }
    
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #004aad, #007bff);
      color: white;
      margin-bottom: 40px;
    }
    
    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    
    .btn-primary {
      display: inline-block;
      padding: 12px 30px;
      background: #ffd700;
      color: #333;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .btn-primary:hover {
      background: #ffed4a;
      transform: translateY(-2px);
    }
    
    .section-title {
      text-align: center;
      margin: 40px 0 30px;
      color: #333;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-section">
      <img src="https://cdn-icons-png.flaticon.com/128/9098/9098749.png" alt="Event" />
      <h1>Event Booking Hub</h1>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search Events..." />
    </div>

     <nav class="navbar" id="navbar">
      <!-- Dynamic links will be injected here by JS -->
    </nav>

  </header>

  <main>
    <section class="hero">
      <h2>Discover, Book, and Enjoy Events Around You</h2>
      <p>From music festivals to tech conferences — find events that inspire you.</p>
      <a href="events.html" class="btn-primary">Explore Events</a>
    </section>

    <section class="events-section" style="padding: 0 20px 40px;">
      <h2 class="section-title">Featured Events</h2>
      <div id="event-list" class="event-container">
        <!-- Event cards will load dynamically -->
      </div>
      <div style="text-align: center; margin-top: 30px;">
        <a href="events.html" class="btn-primary">View All Events</a>
      </div>
    </section>
  </main>

  <footer style="text-align: center; padding: 20px; background: #333; color: white;">
    <p>© 2025 Event Booking System | Designed with Love!</p>
  </footer>

  <script>
    // ====== Dynamic Navbar Setup ======
    const navbar = document.getElementById('navbar');
    const user = JSON.parse(localStorage.getItem('user'));

    function renderNavbar() {
      let navHTML = '';

      if (!user) {
        // Guest view
        navHTML = `
          <a href="index.html" class="active">Home</a>
          <a href="events.html">Events</a>
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        `;
      } else if (user.role === 'user') {
        // Logged-in user
        navHTML = `
          <a href="index.html" class="active">Home</a>
          <a href="events.html">Events</a>
          <a href="mybookings.html">My Bookings</a>
          <a href="#" id="logoutBtn">Logout</a>
        `;
      } else if (user.role === 'organizer') {
        // Organizer view
        navHTML = `
          <a href="index.html" class="active">Home</a>
          <a href="events.html">Events</a>
          <a href="organizer.html">My Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        `;
      } else if (user.role === 'admin') {
        // Admin view
        navHTML = `
          <a href="index.html" class="active">Home</a>
          <a href="events.html">Events</a>
          <a href="admin.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        `;
      }

      navbar.innerHTML = navHTML;

      // Logout functionality
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('user');
          window.location.href = 'index.html';
        });
      }
    }

    renderNavbar();

    // ====== Load Events Dynamically ======
    fetch('http://localhost:5000/api/events')
      .then(res => res.json())
      .then(events => {
        const eventList = document.getElementById('event-list');
        eventList.innerHTML = '';

        // Display only 6 featured events on homepage
        const featuredEvents = events.slice(0, 6);
        
        if (featuredEvents.length === 0) {
          eventList.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No events available. Check back later!</p>';
          return;
        }

        featuredEvents.forEach(event => {
          const eventCard = `
            <div class="event-card">
              <img src="${event.image }" alt="${event.title}" />
              <h3>${event.title}</h3>
              <p><strong>Date:</strong> ${new Date(event.date).toLocaleDateString()}</p>
              <p><strong>Location:</strong> ${event.location}</p>
              <p><strong>Price:</strong> ₹${event.price || 'Free'}</p>
              <a href="booking.html?eventId=${event.id}" class="btn-book">Book Now</a>
            </div>
          `;
          eventList.insertAdjacentHTML('beforeend', eventCard);
        });
      })
      .catch(err => {
        console.error('Error loading events:', err);
        document.getElementById('event-list').innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Error loading events. Please try again later.</p>';
      });

    // ====== Event Search ======
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('keyup', e => {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.event-card');

      cards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        card.style.display = title.includes(term) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
